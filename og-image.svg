<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#000000"/>
  <!-- Sub-pixel grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#222222" stroke-width="2"/>
  
  <!-- Content -->
  <g transform="translate(80, 140)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="380" height="36" rx="18" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#00FF9D"/>
    <text x="36" y="23" font-family="'Geist Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#00FF9D" letter-spacing="1">AVAILABLE FOR ROLES // FULL-STACK &amp; AI</text>
    
    <!-- Title -->
    <text x="0" y="120" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">Shaikh Hunain</text>
    <text x="0" y="180" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="700" fill="#A1A1AA">AI &amp; Systems Engineer</text>

    <!-- Bio -->
    <text x="0" y="240" font-family="'Inter', sans-serif" font-size="20" fill="#71717A">B.Tech CS &amp; AI student at Vishwakarma Institute of Technology (VIT), Pune.</text>
    <text x="0" y="270" font-family="'Inter', sans-serif" font-size="20" fill="#71717A">Building machine learning pipelines, autonomous robotics &amp; high-performance web systems.</text>

    <!-- Badges -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#121212" stroke="#27272A"/>
      <text x="60" y="21" font-family="'Geist Mono', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">PyTorch</text>
      
      <rect x="132" y="0" width="120" height="32" rx="6" fill="#121212" stroke="#27272A"/>
      <text x="192" y="21" font-family="'Geist Mono', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">React.js</text>

      <rect x="264" y="0" width="120" height="32" rx="6" fill="#121212" stroke="#27272A"/>
      <text x="324" y="21" font-family="'Geist Mono', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">Node.js</text>

      <rect x="396" y="0" width="140" height="32" rx="6" fill="#121212" stroke="#27272A"/>
      <text x="466" y="21" font-family="'Geist Mono', monospace" font-size="13" fill="#A1A1AA" text-anchor="middle">MediaPipe</text>
    </g>
  </g>

  <!-- Watermark Footer -->
  <text x="1120" y="560" font-family="'Geist Mono', monospace" font-size="16" fill="#52525B" text-anchor="end">www.xarsal.xyz</text>
</svg>
